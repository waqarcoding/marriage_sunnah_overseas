version: '3.8'
services:
  frontend:
    image: node:24.13.0-alpine
    container_name: marriage-frontend-dev
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    env_file:
      - ./client/.env
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./server
    container_name: marriage-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: marriage-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Root123Root
      MYSQL_DATABASE: marriage_sunna_overseas
      MYSQL_USER: waqarcoding
      MYSQL_PASSWORD: Root123Root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./marriage_sunna_overseas.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRoot123Root" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: marriage-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: waqarcoding
      PMA_PASSWORD: Root123Root
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
