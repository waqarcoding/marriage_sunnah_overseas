name: app
description: Marriage Sunnah Overseas - Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────────
  get: ^4.6.6
  get_storage: ^2.1.1

  # ── Networking ────────────────────────────────────────────────────────────────
  http: ^1.2.0

  # ── Real-time Socket (Socket.IO) ──────────────────────────────────────────────
  socket_io_client: ^2.0.3+1

  # ── Push Notifications ────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # ── UI Components ─────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  swipe_cards: ^2.0.0+1

  # ── Media ─────────────────────────────────────────────────────────────────────
  image_picker: ^1.0.7

  # ── Utilities ─────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  jwt_decoder: ^2.0.1
  connectivity_plus: ^6.1.0
  geolocator: ^11.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
   
    - assets/images/

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700