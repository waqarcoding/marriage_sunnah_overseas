version: '3.8'

services:
  backend:
    build: ./server
    container_name: marriage-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./client
    container_name: marriage-frontend
    restart: always
    ports:
      - "3000:80"
    env_file:
      - ./client/.env
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: marriage-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Root123Root
      MYSQL_DATABASE: marriage_sunna_overseas
      MYSQL_USER: waqarcoding
      MYSQL_PASSWORD: Root123Root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./marriage_sunna_overseas.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRoot123Root" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: marriage-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: waqarcoding
      PMA_PASSWORD: Root123Root
    depends_on:
      - db

volumes:
  mysql_data:
